[project]
name = "kb"
version = "0.1.0"
description = "Base de conocimiento personal: indexado (automatizacion) + RAG + servidor MCP, todo en un solo proyecto."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "google-genai>=0.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Embeddings locales (offline, sin costo de API). uv sync --extra local
local = ["fastembed>=0.3"]

[project.scripts]
kb = "kb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "fastembed.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
